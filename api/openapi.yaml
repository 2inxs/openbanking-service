responses:
  BadRequest:
    description: Некорректные параметры или тело запроса
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ErrorResponse"
  NotFound:
    description: Ресурс не найден или принадлежит другому пользователю
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ErrorResponse"
  UpstreamError:
    description: Внешний источник данных недоступен или вернул ошибку
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ErrorResponse"
  InternalError:
    description: Внутренняя ошибка сервера
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ErrorResponse"
