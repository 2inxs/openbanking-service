components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    InteractionID:
      name: x-fapi-interaction-id
      in: header
      required: false
      schema:
        type: string
        format: uuid

  schemas:
    BankAmount:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          example: "150050.00"
        currency:
          type: string
          example: "RUB"

    BankAccount:
      type: object
      required: [accountId, currency, accountType, accountSubType]
      properties:
        accountId:
          type: string
          example: "acc-001"
        status:
          type: string
          enum: [Enabled, Disabled, Deleted, Pending]
        currency:
          type: string
          example: "RUB"
        accountType:
          type: string
          enum: [Personal]
        accountSubType:
          type: string
          enum: [CurrentAccount, Savings, CreditCard, PrePaidCard, Loan, Mortgage]
        accountDescription:
          type: string
        AccountDetails:
          type: array
          items:
            type: object
            properties:
              schemeName:
                type: string
              identification:
                type: string
              name:
                type: string

    BankBalance:
      type: object
      required: [accountId, creditDebitIndicator, type, dateTime, Amount]
      properties:
        accountId:
          type: string
        creditDebitIndicator:
          type: string
          enum: [Credit, Debit]
        type:
          type: string
          enum: [ClosingAvailable]
        dateTime:
          type: string
          format: date-time
        Amount:
          $ref: "#/components/schemas/BankAmount"

    BankTransaction:
      type: object
      required: [accountId, transactionId, creditDebitIndicator, status, bookingDateTime, Amount]
      properties:
        accountId:
          type: string
        transactionId:
          type: string
        creditDebitIndicator:
          type: string
          enum: [Credit, Debit]
        status:
          type: string
          enum: [Booked, Pending]
        bookingDateTime:
          type: string
          format: date-time
        valueDateTime:
          type: string
          format: date-time
        transactionInformation:
          type: string
        Amount:
          $ref: "#/components/schemas/BankAmount"
        MerchantDetails:
          type: object
          properties:
            merchantName:
              type: string
            merchantCategoryCode:
              type: string

    Links:
      type: object
      required: [self]
      properties:
        self:
          type: string

    Meta:
      type: object
      description: ?????????? ?????? (? ??????? ???????????? ??? ????????? ???????????? ?????? ?????? `{}`)

    BankErrorResponse:
      type: object
      required: [code, message, errors]
      properties:
        code:
          type: string
          example: "401"
        id:
          type: string
          example: "c1a5e7c4-0000-0000-0000-000000000001"
        message:
          type: string
          example: "????????? ???????????"
        errors:
          type: array
          items:
            type: object
            required: [errorCode, message]
            properties:
              errorCode:
                type: string
                example: "Token.Invalid"
              message:
                type: string
                example: "???????? ??? ????????????? ?????"
              path:
                type: string

  responses:
    Unauthorized:
      description: ??????????? ??? ???????? Bearer-?????
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BankErrorResponse"
    NotFound:
      description: ???? ?? ??????
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BankErrorResponse"
